name: Tests

on:
  push:
    branches: [master, main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Run pre-commit checks (lint + tests)
        run: uv run pre-commit run --all-files

      # Coverage is asked for here rather than in addopts, so that the default
      # run stays the fast one the suite's budget is measured against.
      - name: Measure coverage
        run: >
          uv run pytest tests/
          --cov=urhpk --cov=contest_video --cov=puskas_logger
          --cov=on4kst_irc_bridge --cov=puskas_harvester
          --cov=puskas_standings --cov=hamlib_supervisor
          --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-pages-artifact@v3
        with:
          path: htmlcov/

  deploy-coverage:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
