[project]
name = "urhpk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "prompt_toolkit>=3.0",
    "numpy>=1.26",
    "pyte>=0.8",
    "pillow>=10.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
# Render-only, and 50 MB of it: contest_video.py asks for this group in its own
# shebang so the logger's environment on the contest laptop stays without it.
render = ["opencv-python-headless>=4.10"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long — long lines are intentional in some places
    "E701",  # multiple statements on one line — compact if/return style in lookup functions
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# Smoke tests start a real logger on a pty and cost ~11s; they are opt-in with
# `-m smoke` so the default run and pre-commit stay fast.
#
# Coverage is not here: it costs ~25% of the run, and its share grows with the
# size of the source rather than with test slowness, which would make the
# suite's own budget (tests/conftest.py) measure the wrong thing. CI asks for
# it explicitly, which is what produces the published htmlcov.
addopts = "-m 'not smoke'"
markers = ["smoke: drives a real process end to end; opt in with -m smoke"]
# Anything slower than this is a hang or a guessed sleep -- the slowest honest
# test measures an age growing over time and takes 0.71s.
timeout = 5
timeout_method = "signal"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
